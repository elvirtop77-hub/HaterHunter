# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Java/Kotlin compatibility
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official

# Gradle parallel build and caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Avoid deprecated features warnings
android.deprecatedAPI=false

# Termux/low-RAM devices: reduce workers to avoid OOM
org.gradle.workers.max=1
buildDir=/data/data/com.termux/files/home/storage/external-0/HaterHunter-build
android.enableAapt2=false
