name: Fix Gradle Wrapper

on:
  workflow_dispatch:

jobs:
  regenerate-wrapper:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Set up Java
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 3. Install Gradle
      - name: Install Gradle
        uses: gradle/gradle-build-action@v2

      # 4. Regenerate Gradle wrapper
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 7.6.2

      # 5. Commit and push changes
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m "Regenerate Gradle wrapper via GitHub Actions"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
