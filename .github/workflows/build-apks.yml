name: Build and Sign APK

on:
  push:
    branches:
      - main   # or your branch name
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cache Gradle dependencies for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      # 3. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 4. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          wrapper-validation: true

      # 5. Make Gradle Wrapper executable
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      # 6. Restore Keystore from GitHub secret
      - name: Restore Keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # 7. Build Release APK (signed automatically via Gradle env variables)
      - name: Build Release APK
        run: ./gradlew clean assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 8. Upload Signed APK as artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MyApp-Signed-Release-APK
          path: app/build/outputs/apk/release/*.apk
